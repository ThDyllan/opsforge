676" width="240" height="76" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.6"/><text x="726.0" y="708.15" font-family="Segoe UI, Calibri, sans-serif" font-size="19" font-weight="600" fill="#1e293b" text-anchor="middle">Image API</text><text x="726.0" y="733.15" font-family="Segoe UI, Calibri, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">build + import</text><line x1="573" y1="714" x2="600" y2="714" stroke="#fcd34d" stroke-width="2.4" marker-end="url(#ah)"/><rect x="878" y="676" width="240" height="76" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.6"/><text x="998.0" y="708.15" font-family="Segoe UI, Calibri, sans-serif" font-size="19" font-weight="600" fill="#1e293b" text-anchor="middle">Manifests k8s/</text><text x="998.0" y="733.15" font-family="Segoe UI, Calibri, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">appliqués avec wait</text><line x1="845" y1="714" x2="872" y2="714" stroke="#fcd34d" stroke-width="2.4" marker-end="url(#ah)"/><rect x="1150" y="676" width="240" height="76" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.6"/><text x="1270.0" y="708.15" font-family="Segoe UI, Calibri, sans-serif" font-size="19" font-weight="600" fill="#1e293b" text-anchor="middle">Vérification</text><text x="1270.0" y="733.15" font-family="Segoe UI, Calibri, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">/health + /ready = 200</text><line x1="1117" y1="714" x2="1144" y2="714" stroke="#fcd34d" stroke-width="2.4" marker-end="url(#ah)"/><text x="62" y="780" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="400" fill="#64748b">Idempotent : rejouable sans rien recréer. Le run échoue si l'application ne répond pas.</text><text x="40" y="846" font-family="Segoe UI, Calibri, sans-serif" font-size="15.5" font-weight="400" fill="#1e293b">Les deux chaînes sont indépendantes : la CI valide le code et l'image sans rien publier ; Ansible reconstruit l'image localement et déploie l'infrastructure locale.</text></svg>