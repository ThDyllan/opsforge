<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="830" viewBox="0 0 1520 830"><rect width="1520" height="830" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect x="40" y="40" width="1046" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="58" y="66" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="700" fill="#0f766e" letter-spacing="0.4">APPLICATION OPSFORGE</text><rect x="70" y="100" width="150" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="145.0" y="134.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Opérateur</text><rect x="275" y="100" width="150" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="350.0" y="124.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Console web</text><text x="350.0" y="144.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Jinja2</text><rect x="480" y="100" width="150" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="555.0" y="124.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">API FastAPI</text><text x="555.0" y="144.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">22 routes JSON</text><rect x="685" y="100" width="150" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="760.0" y="124.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Domaine</text><text x="760.0" y="144.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">transitions strictes</text><path d="M 890 107 a 75.0 11 0 0 1 150 0 v 44 a 75.0 11 0 0 1 -150 0 z" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.6"/><path d="M 890 107 a 75.0 11 0 0 0 150 0" fill="none" stroke="#5eead4" stroke-width="1.6"/><text x="965.0" y="135.0" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">PostgreSQL</text><line x1="220" y1="129.0" x2="269" y2="129.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><line x1="425" y1="129.0" x2="474" y2="129.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><line x1="630" y1="129.0" x2="679" y2="129.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><line x1="835" y1="129.0" x2="884" y2="129.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="238" width="210" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="505.0" y="263.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Journal d'audit</text><text x="505.0" y="283.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">+ timeline d'incident</text><rect x="660" y="238" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.4"/><text x="735.0" y="273.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">/metrics</text><line x1="530" y1="158" x2="480" y2="234" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/><line x1="580" y1="158" x2="700" y2="234" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/><text x="70" y="335" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b">Runbooks : checklists manuelles et 5 automatisations approuvées dans le code — aucune commande arbitraire</text><rect x="1120" y="40" width="360" height="320" rx="12" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.6"/><text x="1138" y="66" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="700" fill="#115e59" letter-spacing="0.4">SUPERVISION RÉELLE (k3d)</text><rect x="1160" y="100" width="280" height="58" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.4"/><text x="1300.0" y="134.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Prometheus</text><rect x="1160" y="186" width="280" height="58" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.4"/><text x="1300.0" y="220.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Règle OpsForgeApiDown</text><rect x="1160" y="272" width="280" height="58" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.4"/><text x="1300.0" y="306.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Dashboard Grafana</text><line x1="1300" y1="158" x2="1300" y2="182" stroke="#115e59" stroke-width="2" marker-end="url(#ah)"/><line x1="1300" y1="244" x2="1300" y2="268" stroke="#115e59" stroke-width="2" marker-end="url(#ah)"/><path d="M 812 262 Q 980 258 1156 140" fill="none" stroke="#115e59" stroke-width="2" marker-end="url(#ah)"/><rect x="942.25" y="239" width="85.5" height="19" rx="4" fill="#ffffff" opacity="0.94"/><text x="985" y="252" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" fill="#115e59" text-anchor="middle">scrape 15 s</text><rect x="40" y="396" width="1440" height="156" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="58" y="422" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" letter-spacing="0.4">CHAÎNE 1 — INTÉGRATION CONTINUE (GitHub Actions, à chaque push)</text><rect x="70" y="446" width="232" height="64" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/><text x="186.0" y="473.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Ruff</text><text x="186.0" y="493.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">lint</text><rect x="324" y="446" width="232" height="64" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/><text x="440.0" y="473.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">38 tests</text><text x="440.0" y="493.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">SQLite en mémoire</text><line x1="301" y1="478" x2="319" y2="478" stroke="#93c5fd" stroke-width="2" marker-end="url(#ah)"/><rect x="578" y="446" width="232" height="64" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/><text x="694.0" y="473.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">1 test</text><text x="694.0" y="493.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">intégration PostgreSQL</text><line x1="555" y1="478" x2="573" y2="478" stroke="#93c5fd" stroke-width="2" marker-end="url(#ah)"/><rect x="832" y="446" width="232" height="64" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/><text x="948.0" y="473.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Build image</text><text x="948.0" y="493.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Docker</text><line x1="809" y1="478" x2="827" y2="478" stroke="#93c5fd" stroke-width="2" marker-end="url(#ah)"/><rect x="1086" y="446" width="232" height="64" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/><text x="1202.0" y="473.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Scan Trivy</text><text x="1202.0" y="493.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">advisory</text><line x1="1063" y1="478" x2="1081" y2="478" stroke="#93c5fd" stroke-width="2" marker-end="url(#ah)"/><text x="70" y="536" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b">Ne publie ni ne déploie rien : pas de registre d'images, pas de déploiement continu distant.</text><rect x="40" y="586" width="1440" height="156" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/><text x="58" y="612" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="700" fill="#b45309" letter-spacing="0.4">CHAÎNE 2 — AUTOMATISATION DU DÉPLOIEMENT D'INFRASTRUCTURE (Ansible, une commande)</text><rect x="70" y="636" width="232" height="64" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4"/><text x="186.0" y="663.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">./ansible/run.sh</text><text x="186.0" y="683.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">control node conteneurisé</text><rect x="324" y="636" width="232" height="64" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4"/><text x="440.0" y="663.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Cluster k3d</text><text x="440.0" y="683.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">créé seulement si absent</text><line x1="301" y1="668" x2="319" y2="668" stroke="#fcd34d" stroke-width="2" marker-end="url(#ah)"/><rect x="578" y="636" width="232" height="64" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4"/><text x="694.0" y="663.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Image API</text><text x="694.0" y="683.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">build + import</text><line x1="555" y1="668" x2="573" y2="668" stroke="#fcd34d" stroke-width="2" marker-end="url(#ah)"/><rect x="832" y="636" width="232" height="64" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4"/><text x="948.0" y="663.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Manifests k8s/</text><text x="948.0" y="683.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">appliqués avec wait</text><line x1="809" y1="668" x2="827" y2="668" stroke="#fcd34d" stroke-width="2" marker-end="url(#ah)"/><rect x="1086" y="636" width="232" height="64" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4"/><text x="1202.0" y="663.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Vérification</text><text x="1202.0" y="683.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">/health + /ready = 200</text><line x1="1063" y1="668" x2="1081" y2="668" stroke="#fcd34d" stroke-width="2" marker-end="url(#ah)"/><text x="70" y="726" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b">Idempotent : rejouable sans rien recréer. Le run échoue si l'application ne répond pas.</text><text x="40" y="786" font-family="Segoe UI, Calibri, sans-serif" font-size="13.5" font-weight="400" fill="#1e293b">Les deux chaînes sont indépendantes : la CI valide le code et l'image sans rien publier ; Ansible reconstruit l'image localement et déploie l'infrastructure locale.</text></svg>