oe UI, Calibri, sans-serif" font-size="12.5" fill="#b45309" text-anchor="middle">pilote</text><rect x="395" y="128" width="470" height="560" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="413" y="154" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="700" fill="#64748b" letter-spacing="0.4">namespace  opsforge</text><rect x="425" y="164" width="410" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="630.0" y="197.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Service NodePort 30080</text><rect x="425" y="256" width="410" height="82" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.4"/><text x="630.0" y="282.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Deployment  opsforge-api</text><text x="630.0" y="302.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">non-root UID 10001 · rootfs en lecture seule</text><text x="630.0" y="322.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">probes distinctes : /health (liveness) · /ready (readiness)</text><rect x="425" y="374" width="410" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="630.0" y="399.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Service postgres — ClusterIP 5432</text><text x="630.0" y="419.25" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">interne au cluster, non exposé</text><rect x="425" y="470" width="410" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="630.0" y="503.25" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">StatefulSet  postgres-0</text><path d="M 425 573 a 205.0 11 0 0 1 410 0 v 70 a 205.0 11 0 0 1 -410 0 z" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.6"/><path d="M 425 573 a 205.0 11 0 0 0 410 0" fill="none" stroke="#5eead4" stroke-width="1.6"/><text x="630.0" y="595.0" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">PVC postgres-data</text><text x="630.0" y="614.0" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">1 Gi · StorageClass local-path</text><text x="630.0" y="633.0" font-family="Segoe UI, Calibri, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">persistance prouvée après recréation du pod</text><line x1="630" y1="220" x2="630" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><line x1="630" y1="338" x2="630" y2="370" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><line x1="630" y1="434" x2="630" y2="466" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><line x1="630" y1="526" x2="630" y2="558" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><path d="M 317 269 Q 380 284 421 192" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/><rect x="135.75" y="327" width="228.5" height="19" rx="4" fill="#ffffff" opacity="0.94"/><text x="250" y="340" font-family="Segoe UI, Calibri, sans-serif" font-size="12.5" fill="#1d4ed8" text-anchor="middle">127.0.0.1:8080  →  NodePort 30080</text><rect x="900" y="128" width="340" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="918" y="154" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="700" fill="#64748b" letter-spacing="0.4">namespace  monitoring</text><rect x="930" y="166" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.4"/><text x="1070.0" y="199.25" font-family="Segoe UI, Calibri, sans-serif" font-size=