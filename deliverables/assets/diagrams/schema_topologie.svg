ll="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/><text x="635.0" y="567.65" font-family="Segoe UI, Calibri, sans-serif" font-size="19" font-weight="600" fill="#1e293b" text-anchor="middle">StatefulSet  postgres-0</text><path d="M 425 633 a 210.0 13 0 0 1 420 0 v 80 a 210.0 13 0 0 1 -420 0 z" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.8"/><path d="M 425 633 a 210.0 13 0 0 0 420 0" fill="none" stroke="#5eead4" stroke-width="1.8"/><text x="635.0" y="655.0" font-family="Segoe UI, Calibri, sans-serif" font-size="19" font-weight="600" fill="#1e293b" text-anchor="middle">PVC postgres-data</text><text x="635.0" y="680.0" font-family="Segoe UI, Calibri, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">1 Gi · StorageClass local-path</text><text x="635.0" y="705.0" font-family="Segoe UI, Calibri, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">persistance prouvée après recréation du pod</text><line x1="635" y1="242" x2="635" y2="264" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#ah)"/><line x1="635" y1="394" x2="635" y2="416" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#ah)"/><line x1="635" y1="502" x2="635" y2="524" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#ah)"/><line x1="635" y1="594" x2="635" y2="616" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#ah)"/><path d="M 307 288 Q 370 300 421 206" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ah)"/><rect x="106.60000000000002" y="356" width="266.79999999999995" height="22" rx="5" fill="#ffffff" opacity="0.94"/><text x="240" y="372" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" fill="#1d4ed8" text-anchor="middle">127.0.0.1:8080  →  NodePort 30080</text><rect x="905" y="132" width="350" height="400" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="925" y="162" font-family="Segoe UI, Calibri, sans-serif" font-size="17.5" font-weight="700" fill="#64748b" letter-spacing="0.4">name