name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-scan:
    name: Lint, test, build, and scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsforge
          POSTGRES_PASSWORD: opsforge
          POSTGRES_DB: opsforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsforge -d opsforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IMAGE_NAME: opsforge-api
      IMAGE_TAG: ${{ github.sha }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run SQLite unit tests
        run: pytest tests/test_app.py

      - name: Run PostgreSQL integration test
        env:
          DATABASE_URL: postgresql+psycopg://opsforge:opsforge@127.0.0.1:5432/opsforge
        run: pytest tests/postgres_integration.py

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .

      # Advisory (non-blocking) security scan: HIGH/CRITICAL findings are printed
      # for review (documented scope choice in docs/RISKS_AND_TECHNICAL_DEBT.md).
      # exit-code "1" makes the step report outcome=failure when vulnerabilities
      # are found, so the signal stays visible, while continue-on-error keeps the
      # job green (non-blocking). Turn it into a hard gate only via an explicit
      # policy decision (e.g. add ignore-unfixed and drop continue-on-error).
      - name: Run Trivy image scan (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: opsforge-api:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
